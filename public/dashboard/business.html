<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Alphine AI | Business account</title><style>body{font:16px system-ui;max-width:800px;margin:32px auto;padding:0 20px;color:#183047}section{border:1px solid #ccd5df;border-radius:12px;padding:20px;margin:16px 0}input,button{font:inherit;padding:10px;margin:5px 0;max-width:100%;box-sizing:border-box}label{display:block}pre{white-space:pre-wrap;overflow-wrap:anywhere}button{cursor:pointer}</style></head><body><h1>Alphine AI — Business account</h1><section><h2>Secure sign-in</h2><form id="start"><label>Email <input id="email" type="email" required></label><button>Send sign-in code</button></form><form id="redeem"><label>Code <input id="code" required autocomplete="one-time-code"></label><button>Sign in</button></form></section><p id="status" role="status"></p><section id="account" hidden><button id="refresh">Refresh account</button><button id="logout">Sign out</button><h2>Business profile</h2><pre id="profile"></pre><h2>Call routing</h2><pre id="routing"></pre><h2>Customer requests</h2><pre id="requests"></pre><h2>Knowledge upload</h2><form id="upload"><label>PDF document <input id="file" type="file" accept="application/pdf" required></label><button>Upload</button></form></section><script src="/dashboard/business.js" defer></script></body></html>
