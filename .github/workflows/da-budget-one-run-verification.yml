name: DA one-run budget verification
on:
  push:
    branches: [da-budget-verification-b232]
    paths: ['.github/workflows/da-budget-one-run-verification.yml']
permissions:
  contents: read
concurrency:
  group: da-budget-one-run-verification-b232
  cancel-in-progress: false
jobs:
  budget:
    if: >-
      github.repository == 'alphineaiinc/aca-realtime-gateway-clean' &&
      github.ref == 'refs/heads/da-budget-verification-b232' &&
      github.event_name == 'push' && github.run_attempt == 1 &&
      github.actor == 'alphineaiinc' && github.actor_id == '230486228' &&
      github.triggering_actor == 'alphineaiinc' &&
      github.event.before == '883766f5d68d85f282d3a198365ccfdabfcad8e1' &&
      github.event.created == false && github.event.deleted == false &&
      github.event.forced == false && github.event.head_commit.id == github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: da_budget_test
          POSTGRES_PASSWORD: disposable-only
          POSTGRES_DB: da_budget_disposable
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U da_budget_test -d da_budget_disposable" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify single authorized change and detach to frozen test revision
        run: |
          set -euo pipefail
          predecessor=883766f5d68d85f282d3a198365ccfdabfcad8e1
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-list --parents -n 1 HEAD)" = "$GITHUB_SHA $predecessor"
          test "$(git diff --name-status "$predecessor" HEAD)" = "$(printf 'A\t.github/workflows/da-budget-one-run-verification.yml')"
          git checkout --detach "$predecessor"
          test "$(git rev-parse HEAD)" = "$predecessor"
          git diff --exit-code 5f683f1ed79cd6730be6824955aca9a2e4ed4537 HEAD -- src/automation/engineeringTeam package.json package-lock.json
          test "$(git hash-object verification/da-budget-postgres.integration.cjs)" = 3360256a025fb5fb5cc793f5e5246684b0e80d56
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Disabled source regression tests
        run: node --test src/automation/engineeringTeam/*Disabled.test.js
      - name: Nine PostgreSQL adapter tests
        run: timeout --signal=TERM --kill-after=5s 90s node --test verification/da-budget-postgres.integration.cjs
        env:
          DA_BUDGET_TEST_ONLY: '1'
          DA_BUDGET_DISPOSABLE_CONFIRMED: '1'
          DA_BUDGET_TEST_DATABASE_URL: postgresql://da_budget_test:disposable-only@127.0.0.1:5432/da_budget_disposable
      - name: Verify no disposable test schema remains
        if: ${{ always() }}
        env:
          SERVICE_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          test -n "$SERVICE_ID"
          count=$(timeout 10s docker exec "$SERVICE_ID" psql -U da_budget_test -d da_budget_disposable -At -c "SELECT count(*) FROM pg_namespace WHERE left(nspname,7)='budget_'")
          test "$count" = 0
          echo 'Disposable test schema count: 0'
      - name: Remove exact disposable service and verify absence
        if: ${{ always() }}
        env:
          SERVICE_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          test -n "$SERVICE_ID"
          [[ "$SERVICE_ID" =~ ^[0-9a-f]{64}$ ]]
          test "$(timeout 10s docker inspect --format '{{.Id}}' "$SERVICE_ID")" = "$SERVICE_ID"
          timeout 15s docker rm -f -v "$SERVICE_ID"
          remaining=$(timeout 10s docker ps -aq --no-trunc --filter "id=$SERVICE_ID")
          test -z "$remaining"
          echo 'Exact disposable service container absent'
