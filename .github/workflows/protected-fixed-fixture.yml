name: Protected fixed fixture (development evidence only)
on:
  push:
    branches: [aca-protected-sandbox-harness-draft]
    paths: ['.github/workflows/protected-fixed-fixture.yml']
permissions: {}
jobs:
  fixed-fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Resolve official image and execute fixed probe without checkout
        shell: bash
        run: |
          set -euo pipefail
          image='node@sha256:be979e5523c76fa4d5ca4ebd3099078f220aa47ec39c48ad5b5df9314debd6eb'
          docker pull "$image"
          [[ "$image" =~ ^node@sha256:[a-f0-9]{64}$ ]]
          echo "Observed image: $image"
          docker version --format '{{.Server.Version}}'
          name="alphine-fixed-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          result="$(timeout 20s docker run --rm --name "$name" --pull=never --network=none --read-only --user=65534:65534 --cap-drop=ALL --security-opt=no-new-privileges --pids-limit=32 --memory=128m --memory-swap=128m --cpus=0.5 --tmpfs=/tmp:rw,noexec,nosuid,nodev,size=8m --entrypoint=node "$image" -e 'const fs=require("node:fs");if(process.getuid()!==65534)process.exit(2);try{fs.writeFileSync("/probe-write","x");process.exit(3)}catch(e){if(!["EROFS","EACCES"].includes(e.code))process.exit(4)};if(fs.existsSync("/var/run/docker.sock"))process.exit(5);const s=fs.readFileSync("/proc/self/status","utf8");if(!/^CapEff:\s*0+$/m.test(s)||!/^NoNewPrivs:\s*1$/m.test(s)||!/^Seccomp:\s*2$/m.test(s))process.exit(6);if(Object.keys(require("node:os").networkInterfaces()).some(n=>n!=="lo"))process.exit(7);fs.writeFileSync("/tmp/probe","ok");process.stdout.write("fixture-ok")')"
          [[ "$result" == fixture-ok ]]
          [[ -z "$(docker ps -aq --filter "name=^/${name}$")" ]]
          echo 'Fixed fixture passed; executionAuthorized=false; attestation=false'
          # Fixed benign sleeping process: verify configured limits and explicit cleanup.
          docker run -d --name "$name" --pull=never --network=none --read-only --user=65534:65534 --cap-drop=ALL --security-opt=no-new-privileges --pids-limit=32 --memory=128m --memory-swap=128m --cpus=0.5 --tmpfs=/tmp:rw,noexec,nosuid,nodev,size=8m --entrypoint=node "$image" -e 'setTimeout(()=>{},60000)'
          [[ "$(docker inspect --format '{{.HostConfig.Memory}} {{.HostConfig.MemorySwap}} {{.HostConfig.NanoCpus}} {{.HostConfig.PidsLimit}}' "$name")" == '134217728 134217728 500000000 32' ]]
          set +e
          timeout 2s docker wait "$name"
          status=$?
          set -e
          [[ "$status" == 124 ]]
          timeout 10s docker rm -f "$name"
          [[ -z "$(docker ps -aq --filter "name=^/${name}$")" ]]
          echo 'Configured resource limits and explicit timeout cleanup passed; attestation=false'
