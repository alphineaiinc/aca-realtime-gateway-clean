name: Marketplace SDK resolution
on:
  pull_request:
    branches: [aca-product-commercial-consolidation]
permissions:
  contents: read
jobs:
  resolve:
    if: github.head_ref == 'aca-chatgpt-marketplace' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      - name: Capture existing dependency baseline
        run: npm audit --omit=dev --json > baseline-audit.json || test -s baseline-audit.json
      - name: Resolve stable SDK and exact lockfile
        run: |
          VERSION=1.32.2
          echo "Resolved SDK: $VERSION"
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --save-exact "@modelcontextprotocol/sdk@$VERSION"
          npm audit fix --package-lock-only --ignore-scripts --no-fund || test -s package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --save-exact nodemailer@10.6.1
          npm ci --ignore-scripts --no-audit --no-fund
          node --test test/marketplace-mail-compat.test.js
          npm test
          git diff -- package.json > dependency-manifest.diff
      - name: Dependency vulnerability assessment
        run: |
          npm audit --omit=dev --audit-level=high --json > marketplace-audit.json
      - name: Emit public dependency files for verified Git transfer
        if: always()
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const crypto=require('node:crypto');
          for(const name of ['package.json','package-lock.json']){
            const data=fs.readFileSync(name,'utf8');
            const parsed=JSON.parse(data);
            if(name==='package-lock.json'){
              for(const p of Object.values(parsed.packages||{})){
                if(p.resolved && !p.resolved.startsWith('https://registry.npmjs.org/'))throw Error('Unexpected registry');
              }
            }
            console.log('ACA_FILE_HASH '+name+' '+crypto.createHash('sha256').update(data).digest('hex'));
            for(let i=0;i<data.length;i+=2000)console.log('ACA_FILE_CHUNK '+name+' '+i+' '+JSON.stringify(data.slice(i,i+2000)));
          }
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marketplace-sdk-lockfile
          path: |
            package.json
            package-lock.json
            baseline-audit.json
            marketplace-audit.json
            dependency-manifest.diff
          retention-days: 1
          if-no-files-found: error
