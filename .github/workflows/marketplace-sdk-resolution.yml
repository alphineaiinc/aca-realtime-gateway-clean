name: Marketplace SDK resolution
on:
  pull_request:
    branches: [aca-product-commercial-consolidation]
permissions:
  contents: read
jobs:
  resolve:
    if: github.head_ref == 'aca-chatgpt-marketplace' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      - name: Install the exact committed dependency lockfile
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ls --depth=0
      - name: Audit the exact committed dependency tree
        run: npm audit --audit-level=moderate --json > marketplace-audit.json
      - name: Run regression suite against the committed dependency tree
        run: npm test
      - name: Emit verified lockfile digest and audit summary
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const crypto=require('node:crypto');
          const data=fs.readFileSync('package-lock.json','utf8');
          console.log('ACA_LOCK_SHA256 '+crypto.createHash('sha256').update(data).digest('hex'));
          const audit=JSON.parse(fs.readFileSync('marketplace-audit.json','utf8'));
          console.log('ACA_AUDIT_SUMMARY '+JSON.stringify(audit.metadata?.vulnerabilities || {}));
          NODE
      - name: Generate exact revision marketplace acceptance bundle
        run: |
          mkdir -p marketplace-bundle
          git archive HEAD .github/workflows/marketplace-sdk-resolution.yml src/marketplace src/brain/utils/sttGoogle.js docs/aca/chatgpt-marketplace.md docs/aca/marketplace-package-checklist.md package.json package-lock.json test/marketplace-mcp-authenticated.test.js test/marketplace-mail-compat.test.js test/marketplace-dependency-surface.test.js | tar -x -C marketplace-bundle
          cp marketplace-audit.json marketplace-bundle/
          git rev-parse HEAD > marketplace-bundle/REVISION
          tar -czf marketplace-acceptance.tar.gz -C marketplace-bundle .
          sha256sum marketplace-acceptance.tar.gz > marketplace-acceptance.sha256
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: marketplace-acceptance
          path: |
            marketplace-acceptance.tar.gz
            marketplace-acceptance.sha256
            marketplace-audit.json
          retention-days: 1
          if-no-files-found: error
