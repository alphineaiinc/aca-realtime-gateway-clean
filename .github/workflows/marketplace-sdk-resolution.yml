name: Marketplace SDK resolution
on:
  pull_request:
    branches: [aca-product-commercial-consolidation]
permissions:
  contents: read
jobs:
  resolve:
    if: github.head_ref == 'aca-chatgpt-marketplace' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      - name: Resolve stable SDK and exact lockfile
        run: |
          VERSION=$(npm view @modelcontextprotocol/sdk@latest version)
          echo "Resolved SDK: $VERSION"
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --save-exact "@modelcontextprotocol/sdk@$VERSION"
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
      - uses: actions/upload-artifact@v4
        with:
          name: marketplace-sdk-lockfile
          path: |
            package.json
            package-lock.json
          retention-days: 1
          if-no-files-found: error
