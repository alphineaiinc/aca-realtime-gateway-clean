name: Marketplace SDK resolution
on:
  pull_request:
    branches: [aca-product-commercial-consolidation]
permissions:
  contents: read
jobs:
  resolve:
    if: github.head_ref == 'aca-chatgpt-marketplace' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      - name: Verify committed dependencies and regressions
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          git diff --exit-code -- package.json package-lock.json
      - name: Dependency vulnerability assessment
        run: npm audit --omit=dev --audit-level=high --json > marketplace-audit.json
      - name: Generate exact revision marketplace acceptance bundle
        run: |
          mkdir -p marketplace-bundle
          git archive HEAD src/marketplace docs/aca/chatgpt-marketplace.md docs/aca/marketplace-package-checklist.md package.json package-lock.json test/marketplace-mcp-authenticated.test.js test/marketplace-mail-compat.test.js | tar -x -C marketplace-bundle
          git rev-parse HEAD > marketplace-bundle/REVISION
          cp marketplace-audit.json marketplace-bundle/
          tar -czf marketplace-acceptance.tar.gz -C marketplace-bundle .
          sha256sum marketplace-acceptance.tar.gz > marketplace-acceptance.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marketplace-acceptance
          path: |
            marketplace-acceptance.tar.gz
            marketplace-acceptance.sha256
            marketplace-audit.json
          retention-days: 1
          if-no-files-found: error
