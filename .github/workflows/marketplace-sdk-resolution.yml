name: Marketplace SDK resolution
on:
  pull_request:
    branches: [aca-product-commercial-consolidation]
permissions:
  contents: read
jobs:
  resolve:
    if: github.head_ref == 'aca-chatgpt-marketplace' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      - name: Capture existing dependency baseline
        run: npm audit --omit=dev --json > baseline-audit.json || test -s baseline-audit.json
      - name: Resolve stable SDK and exact lockfile
        run: |
          VERSION=1.32.2
          echo "Resolved SDK: $VERSION"
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --save-exact "@modelcontextprotocol/sdk@$VERSION"
          npm audit fix --package-lock-only --ignore-scripts --no-fund || test -s package-lock.json
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          git diff -- package.json > dependency-manifest.diff
      - name: Dependency vulnerability assessment
        run: |
          npm audit --omit=dev --audit-level=high --json > marketplace-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marketplace-sdk-lockfile
          path: |
            package.json
            package-lock.json
            baseline-audit.json
            marketplace-audit.json
            dependency-manifest.diff
          retention-days: 1
          if-no-files-found: error
