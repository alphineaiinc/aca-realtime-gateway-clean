name: ACA SEC09 hosted connectivity
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  connectivity:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'aca-product-commercial-consolidation'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify fixed staging health endpoint
        shell: bash
        run: |
          set -euo pipefail
          url=https://alphine-aca-product-staging.onrender.com/health
          status=$(curl --proto '=https' --connect-timeout 10 --max-time 90 --retry 1 --retry-delay 2 --output /dev/null --silent --show-error --write-out '%{http_code}' "$url")
          echo "Staging health HTTP status: $status"
          test "$status" = 200
      - name: Verify diagnostic identity and bounded probes
        shell: bash
        run: |
          set -euo pipefail
          base=https://alphine-aca-product-staging.onrender.com
          ready=$(curl --proto '=https' --connect-timeout 5 --max-time 15 --silent --show-error --output /tmp/aca-ready --write-out '%{http_code}' "$base/__aca_sec09_ready")
          echo "Diagnostic readiness HTTP: $ready"
          test "$ready" = 200
          grep -Fxq 'aca-sec09-probe-v3' /tmp/aca-ready
          check() {
            expected=$1; label=$2; shift 2
            actual=$(curl --proto '=https' --connect-timeout 5 --max-time 15 --silent --show-error --output /dev/null --write-out '%{http_code}' "$@")
            echo "$label HTTP: $actual expected: $expected"
            test "$actual" = "$expected"
          }
          check 204 baseline "$base/__aca_sec09_probe"
          check 204 marker -H 'X-Forwarded-For: 192.0.2.123' "$base/__aca_sec09_probe"
          for i in $(seq 1 5); do check 204 "twilio-$i" "$base/__aca_sec09_capacity/twilio"; done
          check 429 twilio-exhausted "$base/__aca_sec09_capacity/twilio"
          check 204 stripe "$base/__aca_sec09_capacity/stripe"
          check 204 ordinary "$base/__aca_sec09_capacity/ordinary"
