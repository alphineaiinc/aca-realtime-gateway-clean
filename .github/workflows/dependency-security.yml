name: ACA Dependency Security Audit
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  npm-audit:
    name: Production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify lockfile-based dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Fail for high or critical production dependency advisories
        run: npm audit --omit=dev --audit-level=high
