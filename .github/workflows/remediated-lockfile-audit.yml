name: ACA Remediated Lockfile Security Audit
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  production-audit:
    name: Remediated production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout proposed dependency tree
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run strict high and critical vulnerability audit
        run: npm audit --omit=dev --audit-level=high
