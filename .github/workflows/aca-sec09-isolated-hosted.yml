name: ACA SEC09 isolated hosted probes
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  probes:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'aca-sec09-isolated-proxy-diagnostic' && contains(github.event.pull_request.labels.*.name, 'sec09-hosted-authorized')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Fixed staging readiness and synthetic probes
        shell: bash
        run: |
          set -euo pipefail
          base=https://alphine-aca-product-staging.onrender.com
          status=$(curl --proto '=https' --connect-timeout 5 --max-time 15 -sS -o /tmp/aca-ready -w '%{http_code}' "$base/__aca_sec09_ready")
          echo "Readiness HTTP: $status"
          test "$status" = 200
          grep -Fxq 'aca-sec09-probe-v3' /tmp/aca-ready
          check() {
            expected=$1; label=$2; shift 2
            actual=$(curl --proto '=https' --connect-timeout 5 --max-time 15 -sS -o /dev/null -w '%{http_code}' "$@")
            echo "$label HTTP: $actual expected: $expected"
            test "$actual" = "$expected"
          }
          check 204 baseline "$base/__aca_sec09_probe"
          check 204 marker -H 'X-Forwarded-For: 192.0.2.123' "$base/__aca_sec09_probe"
          for i in $(seq 1 5); do check 204 "twilio-$i" "$base/__aca_sec09_capacity/twilio"; done
          check 429 twilio-exhausted "$base/__aca_sec09_capacity/twilio"
          check 204 stripe "$base/__aca_sec09_capacity/stripe"
          check 204 ordinary "$base/__aca_sec09_capacity/ordinary"
