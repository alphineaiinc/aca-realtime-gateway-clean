name: Phase 2 dependency security audit
on:
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/phase2-dependency-security-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: phase2-dependency-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  production-audit:
    name: Production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Fail on high or critical production dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=high
