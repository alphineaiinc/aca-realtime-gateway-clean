name: ACA PR Supervision Event Observer
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, closed]
  pull_request_review:
    types: [submitted, dismissed]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
  issues: read
  checks: read
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted default branch only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Read-only PR event observation
        uses: actions/github-script@v7
        env:
          ACA_PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          script: |
            const fs = require('node:fs');
            const observerPath = './.github/scripts/pr-supervision-reconcile.js';
            if (!fs.existsSync(observerPath)) {
              core.notice('Trusted default branch has no supervisor yet; observation deferred until approved merge.');
              return;
            }
            const {reconcile} = require(observerPath);
            const targeted = ['pull_request','pull_request_review'].includes(context.eventName);
            const prNumber = targeted ? Number(process.env.ACA_PR_NUMBER) : null;
            if (targeted && (!Number.isSafeInteger(prNumber) || prNumber < 1)) throw new Error('invalid_pr_number');
            const decisions = await reconcile({github,owner:context.repo.owner,repo:context.repo.repo,prNumber});
            for (const decision of decisions) core.info(JSON.stringify(decision));
