name: ACA PR Supervision Event Observer
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, closed]
permissions:
  contents: read
  pull-requests: read
  issues: read
  checks: read
jobs:
  observe:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted default branch only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Read-only PR event observation
        uses: actions/github-script@v7
        env:
          ACA_PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          script: |
            const {observe} = require('./.github/scripts/pr-supervision-observer.js');
            const prNumber = Number(process.env.ACA_PR_NUMBER);
            if (!Number.isSafeInteger(prNumber) || prNumber < 1) throw new Error('invalid_pr_number');
            const owner = context.repo.owner, repo = context.repo.repo;
            const result = await github.graphql(`query($owner:String!,$repo:String!,$pr:Int!) {
              repository(owner:$owner,name:$repo) {
                pullRequest(number:$pr) {
                  closingIssuesReferences(first:2) {
                    pageInfo { hasNextPage }
                    nodes { number repository { databaseId } }
                  }
                }
              }
            }`, {owner,repo,pr:prNumber});
            const refs = result?.repository?.pullRequest?.closingIssuesReferences;
            const ids = refs?.nodes || [];
            if (refs?.pageInfo?.hasNextPage || ids.length !== 1) {
              core.info('No unambiguous issue association; observation blocked.');
              return;
            }
            const issueNumber = ids[0]?.number;
            if (!Number.isSafeInteger(issueNumber) || issueNumber < 1) {
              core.info('No valid issue number; observation blocked.');
              return;
            }
            const decision = await observe({github,owner,repo,prNumber,issueNumber});
            core.info(JSON.stringify(decision));
