name: ACA CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: aca-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  node-tests:
    name: Node tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: onboarding_test
          POSTGRES_PASSWORD: onboarding_test_only
          POSTGRES_DB: onboarding_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U onboarding_test -d onboarding_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Syntax check JavaScript files outside dependencies
        run: |
          git ls-files -z '*.js' | grep -zv '^node_modules/' | xargs -0 -r -n 1 node --check
      - name: Run test suite
        run: |
          if node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
            npm test
          else
            node --test test/*.test.js
          fi

      - name: Isolated PostgreSQL onboarding concurrency test
        env:
          RUN_ONBOARDING_STAGING_INTEGRATION: '1'
          ONBOARDING_STAGING_DATABASE_URL: postgres://onboarding_test:onboarding_test_only@localhost:5432/onboarding_test
        run: |
          node -e "const fs=require('node:fs');const {Client}=require('pg');(async()=>{const c=new Client({connectionString:process.env.ONBOARDING_STAGING_DATABASE_URL});await c.connect();try{await c.query(fs.readFileSync('migrations/draft_onboarding_challenges.sql','utf8'))}finally{await c.end()}})().catch(e=>{console.error(e.message);process.exitCode=1})"
          node --test test/onboarding-postgres.integration.test.js

      - name: Isolated product migration and onboarding acceptance
        run: node --test integration/aca-product-postgres.test.js
  hosted-staging:
    name: Hosted ACA staging acceptance
    if: github.event_name == 'pull_request' && github.head_ref == 'aca-l1-integrated-routing-onboarding' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node integration/aca-hosted-acceptance.mjs
