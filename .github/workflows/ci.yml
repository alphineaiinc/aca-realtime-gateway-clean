name: ACA CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: aca-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  node-tests:
    name: Node tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: aca_ci
          POSTGRES_PASSWORD: disposable_ci_only
          POSTGRES_DB: aca_stripe_ci
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U aca_ci -d aca_stripe_ci" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Syntax check JavaScript files outside dependencies
        run: |
          git ls-files -z '*.js' | grep -zv '^node_modules/' | xargs -0 -r -n 1 node --check
      - name: Run test suite
        run: |
          if node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
            npm test
          else
            node --test test/*.test.js
          fi
      - name: Isolated Stripe receipt PostgreSQL integration
        env:
          RUN_STRIPE_RECEIPT_CI: '1'
          STRIPE_RECEIPT_CI_URL: postgresql://aca_ci:disposable_ci_only@127.0.0.1:5432/aca_stripe_ci
        run: node --test test/stripe-event-receipt.integration.test.js test/aca-l5-settlement.integration.test.js test/aca-l5-ledgers.integration.test.js
