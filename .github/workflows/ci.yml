name: ACA CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: aca-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  node-tests:
    name: Node tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: aca_ci
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: aca_engineering_queue_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aca_ci -d aca_engineering_queue_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Syntax check JavaScript files outside dependencies
        run: |
          git ls-files -z '*.js' | grep -zv '^node_modules/' | xargs -0 -r -n 1 node --check
      - name: Run test suite
        run: |
          if node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
            npm test
          else
            node --test test/*.test.js
          fi
      - name: Isolated engineering queue PostgreSQL integration
        env:
          RUN_ENGINEERING_QUEUE_CI: '1'
          ENGINEERING_QUEUE_CI_DATABASE_URL: postgresql://aca_ci:disposable-ci-only@127.0.0.1:5432/aca_engineering_queue_ci
        run: node --test test/eight-agent-durable-queue.integration.test.js

  engineering-sandbox-probe:
    name: Engineering sandbox probe (trusted fixture only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run trusted fixture without network or credentials
        run: |
          docker pull node:22-bookworm-slim
          timeout --kill-after=5s 40s docker run --rm --name aca-sandbox-fixture \
            --network none --read-only --user 65534:65534 \
            --cap-drop ALL --security-opt no-new-privileges \
            --memory 128m --cpus 0.5 --pids-limit 32 \
            --mount "type=bind,source=$PWD/test/fixtures/engineering-sandbox-probe.js,target=/probe.js,readonly" \
            node:22-bookworm-slim node /probe.js

      - name: Execute trusted planned patch in disposable sandbox
        run: |
          set -eu
          work="$(mktemp -d)"
          trap 'docker rm -f aca-patch-fixture >/dev/null 2>&1 || true; rm -rf "$work"' EXIT
          chmod 755 "$work"
          node test/fixtures/engineering-patch-fixture.js > "$work/example.js"
          printf '%s\n' "const assert=require('node:assert/strict'); const add=require('./example.js'); assert.equal(add(2,3),5); assert.equal(add(-2,2),0);" > "$work/check.js"
          chmod 644 "$work/"*.js
          timeout --kill-after=5s 40s docker run --rm --name aca-patch-fixture \
            --network none --read-only --user 65534:65534 \
            --cap-drop ALL --security-opt no-new-privileges \
            --memory 128m --cpus 0.5 --pids-limit 32 \
            --mount "type=bind,source=$work,target=/fixture,readonly" \
            node:22-bookworm-slim node /fixture/check.js
