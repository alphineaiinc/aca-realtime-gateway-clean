name: ACA CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: aca-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  node-tests:
    name: Node tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Syntax check JavaScript files outside dependencies
        run: |
          git ls-files -z '*.js' | grep -zv '^node_modules/' | xargs -0 -r -n 1 node --check
      - name: Run test suite
        run: |
          if node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
            npm test
          else
            node --test test/*.test.js
          fi
  postgres-ledger-integration:
    name: PostgreSQL ledger integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aca_test
          POSTGRES_PASSWORD: aca_test_only
          POSTGRES_DB: aca_automation_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aca_test -d aca_automation_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ACA_TEST_DATABASE_URL: postgresql://aca_test:aca_test_only@localhost:5432/aca_automation_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run isolated PostgreSQL integration
        run: |
          node --test test/postgres-correction-ledger.integration.test.js
          node --test test/postgres-role-isolation.integration.test.js
          node --test test/postgres-repository-rls.integration.test.js
          node --test test/postgres-owner-decision.integration.test.js
          node --test test/postgres-owner-oauth.integration.test.js
          node --test test/postgres-owner-edge-nonce.integration.test.js
