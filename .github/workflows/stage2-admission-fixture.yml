name: Stage 2 scheduler admission fixture
on:
  push:
    branches: [aca-p2-stage2-continuous-observation]
permissions:
  contents: read
jobs:
  admission:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: node --test test/stage2-admission.test.js
