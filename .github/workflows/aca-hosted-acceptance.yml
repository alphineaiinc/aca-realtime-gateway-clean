name: ACA hosted staging acceptance
on:
  push:
    branches: [aca-l1-integrated-routing-onboarding]
    paths: ['.github/workflows/aca-hosted-acceptance.yml','integration/aca-hosted-acceptance.mjs']
permissions:
  contents: read
jobs:
  hosted:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: node integration/aca-hosted-acceptance.mjs
