name: Restricted Stage 1 Manager (review hold)
on:
  push:
    branches: [aca-p2-b02-isolated-integration, aca-p2-stage1-activation]
permissions:
  contents: read
  issues: read
  actions: read
jobs:
  acceptance:
    if: github.repository == 'alphineaiinc/aca-realtime-gateway-clean' && github.ref == 'refs/heads/aca-p2-b02-isolated-integration'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify disabled control and read connectivity (no Manager execution)
        env:
          ACA_READ_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node --test test/stage1-stop-reader.test.js
          node <<'NODE'
          const {stopReader}=require('./.github/scripts/stage1-stop-reader');
          const scope={product:'aca',repository:'alphineaiinc/aca-realtime-gateway-clean',sha:'6678909c7e9e60c08b0bc56c150e9031900a3984'};
          const token=process.env.ACA_READ_TOKEN;
          async function main(){
            const base='https://api.github.com/repos/'+scope.repository;
            const get=async path=>{
              const r=await fetch(base+path,{method:'GET',redirect:'error',signal:AbortSignal.timeout(5000),headers:{Authorization:'Bearer '+token,Accept:'application/vnd.github+json'}});
              if(!r.ok)throw Error('Read failed');
              return r.json();
            };
            const control=await get('/issues/153');
            if(control.number!==153||control.state!=='open'||!Array.isArray(control.labels)||!control.labels.some(l=>l.name==='aca:auto/blocked')||control.labels.some(l=>l.name==='aca:stage1/enabled'))throw Error('Control not disabled');
            if(await stopReader(token)(scope)!==true)throw Error('Stop failed');
            const tracker=await get('/issues/118');
            const runs=await get('/actions/runs?head_sha='+scope.sha+'&per_page=20');
            if(tracker.number!==118||!Array.isArray(runs.workflow_runs)||!runs.workflow_runs.length||runs.workflow_runs.some(r=>r.head_sha!==scope.sha))throw Error('Read evidence denied');
            console.log('Live GET connectivity and disabled control verified; no Manager invocation');
          }
          main().catch(()=>{process.exitCode=1;});
          NODE
  observe:
    if: github.repository == 'alphineaiinc/aca-realtime-gateway-clean' && github.ref == 'refs/heads/aca-p2-stage1-activation' && vars.ACA_STAGE1_APPROVED_CONFIG_SHA == github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: config
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 6678909c7e9e60c08b0bc56c150e9031900a3984
          persist-credentials: false
          path: manager
      - name: Verify pinned source and stop-reader regression
        run: |
          test "$(git -C manager rev-parse HEAD)" = "6678909c7e9e60c08b0bc56c150e9031900a3984"
          test "$(git -C config rev-parse HEAD)" = "$GITHUB_SHA"
          node --test config/test/stage1-stop-reader.test.js
      - name: Bounded observation
        env:
          ACA_READ_TOKEN: ${{ github.token }}
        run: |
          node <<'NODE'
          const {observeOnce}=require('./manager/src/automation/engineeringTeam/restrictedManagerOnce');
          const {stopReader}=require('./config/.github/scripts/stage1-stop-reader');
          const token=process.env.ACA_READ_TOKEN;
          observeOnce({env:{ACA_RESTRICTED_MANAGER_ENABLED:'true',ACA_RESTRICTED_MANAGER_ISSUE:'118',ACA_RESTRICTED_MANAGER_PRODUCT:'aca',ACA_RESTRICTED_MANAGER_REPOSITORY:'alphineaiinc/aca-realtime-gateway-clean',ACA_RESTRICTED_MANAGER_HEAD_SHA:'6678909c7e9e60c08b0bc56c150e9031900a3984',ACA_RESTRICTED_MANAGER_GITHUB_READ_TOKEN:token},readStopState:stopReader(token)}).then(result=>{
            if(result.status!=='observed'||result.executionAuthorized!==false||result.writeAuthorized!==false||result.deployAuthorized!==false||result.paidProviderAuthorized!==false)throw Error('Observation denied');
            console.log(JSON.stringify(result));
          }).catch(()=>{process.exitCode=1;});
          NODE
