name: Phase 2 dependency candidate
on:
  push:
    branches: [aca-phase2-smtp-tls-security-correction]
    paths: ['.github/workflows/phase2-dependency-candidate.yml']
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve and verify candidate
        env:
          npm_config_registry: https://registry.npmjs.org/
          npm_config_fetch_retries: '0'
        run: |
          npm view readdir-glob@4.0.0 dist dependencies engines --json
          npm view minimatch@11.0.1 dist dependencies engines --json
          npm pkg set 'overrides.archiver.readdir-glob=4.0.0' 'overrides.readdir-glob.minimatch=11.0.1'
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          git diff -- package.json package-lock.json
          npm ci --ignore-scripts --no-audit --no-fund
          npm ls archiver readdir-glob minimatch
          node --test test/archive-glob-real-compat.test.js test/billing-archiver-compat.test.js test/emailer-tls-certificate-rejection.test.js
          npm audit --omit=dev --audit-level=moderate
