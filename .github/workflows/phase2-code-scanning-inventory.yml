name: Phase 2 Code Scanning Alert Inventory
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/phase2-code-scanning-inventory.yml'
  workflow_dispatch:
permissions:
  contents: read
  security-events: read
jobs:
  inventory:
    name: Read CodeQL alerts (metadata only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Query code scanning alerts without printing sensitive findings
        shell: bash
        run: |
          set -euo pipefail
          # Exit nonzero on API errors; never interpret 403/404 as zero alerts.
          json="$(gh api --paginate --slurp \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GH_REPO}/code-scanning/alerts?state=open&per_page=100")"
          printf '%s' "$json" | jq -e 'type == "array" and all(.[]; type == "array")' >/dev/null
          printf '%s' "$json" | jq -r '
            [ .[][] | select(.tool.name == "CodeQL") ] as $alerts |
            "Open CodeQL alerts: \($alerts | length)",
            "Open CodeQL alerts by severity: " +
              ([$alerts[] | (.rule.security_severity_level // .rule.severity // "unknown")] |
               group_by(.) | map("\(.[0])=\(length)") | join(", "))
          '
          printf '%s' "$json" | jq -r '
            [ .[][] | select(.tool.name == "CodeQL") ] as $alerts |
            "Top CodeQL rules by alert count:",
            ($alerts | group_by(.rule.id) | map({id: .[0].rule.id, n: length}) |
              sort_by(-.n) | .[:15][] | "  \(.id): \(.n)"),
            (["src/brain/utils/emailer.js",
              ".github/workflows/phase2-code-scanning-inventory.yml",
              ".github/workflows/phase2-dependency-security-audit.yml",
              "test/billing-archiver-compat.test.js",
              "test/emailer-nodemailer-compat.test.js",
              "test/emailer-tls-certificate-rejection.test.js",
              "package.json", "package-lock.json"] as $paths |
             [$alerts[] | select(.most_recent_instance.location.path as $p | $paths | index($p))] as $matches |
             "Open CodeQL alerts in PR-changed files: \($matches | length)",
             ($matches | group_by(.most_recent_instance.location.path) |
               .[] | "  \(.[0].most_recent_instance.location.path): \(length)"))
          '
          # Print only the critical alert's numeric ID, rule and repository-relative path.
          # Never print alert descriptions, snippets, secrets, or source lines.
          printf '%s' "$json" | jq -r '
            [ .[][] | select(.tool.name == "CodeQL")
              | select(.rule.security_severity_level == "critical") ] |
            "Critical CodeQL alert metadata:",
            (.[] | "  id=\(.number) rule=\(.rule.id) path=\(.most_recent_instance.location.path // "unknown")")
          '
          echo "Alert inventory retrieved. Review actual alert locations and dismissals in GitHub Security before merge."
