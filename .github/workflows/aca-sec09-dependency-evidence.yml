name: ACA SEC09 dependency evidence
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  lock:
    if: (github.head_ref == 'aca-product-commercial-consolidation' || github.head_ref == 'aca-cm001-notification-ack' || github.head_ref == 'aca-cm001-gmail-response-validation' || github.head_ref == 'aca-cm001-voice-send-timeout') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate dependency evidence
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node -e 'if(typeof require("express-rate-limit").rateLimit!=="function")process.exit(1)'
          npm audit --json > /tmp/aca-audit.json
          node -e 'const a=require("/tmp/aca-audit.json");if(a.error||!a.vulnerabilities)throw Error("Audit unavailable");for(const n of ["express-rate-limit","ip-address"])if(a.vulnerabilities[n])throw Error(JSON.stringify(a.vulnerabilities[n]));console.log("Selected limiter dependencies have no reported npm audit findings")'
          node -e 'const p=require("./package-lock.json").packages;for(const n of ["express-rate-limit","ip-address"])console.log(n,p["node_modules/"+n].version)'
          git diff --exit-code -- package.json package-lock.json
      - uses: actions/upload-artifact@v4
        with:
          name: aca-sec09-dependency-lock
          path: |
            package.json
            package-lock.json
            /tmp/aca-audit.json
          retention-days: 1
          if-no-files-found: error
