# Proposed runtime acceptance workflow — NOT ACTIVE
# Requires independent review and trusted workflow installation before execution.
name: Reviewed fixed fixture runtime
on:
  workflow_dispatch:
permissions: {}
jobs:
  fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fetch only pinned reviewed source files
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cd "$(mktemp -d)"
          revision='48f993f735797030c9c092a95333de9acb1ab251'
          fetch() {
            mkdir -p "$(dirname "$1")"
            curl --fail --silent --show-error --max-time 30 "https://raw.githubusercontent.com/alphineaiinc/aca-realtime-gateway-clean/$revision/$1" -o "$1"
            [[ "$(git hash-object "$1")" == "$2" ]]
          }
          fetch 'scripts/protected-sandbox/fixtureHarness.js' '4929c8aaa3a341f9cf3f7d04e745f89bf3acfa12'
          fetch 'test/protected-sandbox-failure.test.js' '8a5e050d1a717b0e3045f4a3045ce4aebf778e91'
          fetch 'test/protected-sandbox-fixture-harness.test.js' '75fd7a1547b274225d323309aebfd385c6724e0d'
          [[ "$(uname -s):$(uname -m)" == Linux:x86_64 ]]
          node --test test/protected-sandbox-failure.test.js test/protected-sandbox-fixture-harness.test.js
          timeout 60s docker pull --platform linux/amd64 'node@sha256:be979e5523c76fa4d5ca4ebd3099078f220aa47ec39c48ad5b5df9314debd6eb'
          timeout 90s node -e 'const h=require("./scripts/protected-sandbox/fixtureHarness");const r=h.run(h.imagePin);if(!r.fixturePassed||r.executionAuthorized!==false||r.attestation!==false)process.exit(1);console.log(JSON.stringify(r))'
          timeout 90s node -e 'const assert=require("node:assert/strict");const h=require("./scripts/protected-sandbox/fixtureHarness");assert.throws(()=>h.runTimeoutFixture(),/^Error: Fixed timeout observed$/);assert.throws(()=>h.runFailedQueryFixture(),/^Error: Fixed query failure reconciled$/);console.log("Expected distinct fault denials and ID reconciliation observed")'
          echo 'Development fixture only; no execution authorization or attestation'
      - name: Reconcile residual fixed fixtures on dedicated disposable runner
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          # Dedicated fixture job only. No other workloads may share this daemon.
          ids="$(timeout 10s /usr/bin/docker ps -aq --no-trunc --filter 'name=alphine-fixture-')"
          if [[ -n "$ids" ]]; then
            while IFS= read -r id; do
              [[ "$id" =~ ^[a-f0-9]{64}$ ]]
              name="$(timeout 10s /usr/bin/docker inspect --format '{{.Name}}' "$id")"
              [[ "$name" =~ ^/alphine-fixture-[a-f0-9-]{36}$ ]]
              timeout 10s /usr/bin/docker rm -f "$id"
            done <<< "$ids"
            echo 'Residual fixture detected; cleanup attempted; acceptance denied'
            exit 1
          fi
          echo 'No residual fixed fixtures observed at final query'
